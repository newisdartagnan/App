# Doc&I — environnement de développement local.
#
#   docker compose up -d --build        l'application sur http://localhost:8090
#   docker compose run --rm tests        toute la suite de tests
#
# Les ports diffèrent de ceux de dpi-rdc (8080, 5433) pour que les deux
# projets tournent en même temps sur le même poste.
name: doc-and-i

x-php: &php
  build: .
  image: doc-and-i-php
  init: true
  volumes:
    - .:/var/www
    - vendor:/var/www/vendor
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *php
    environment:
      DOC_AND_I_AUTO_MIGRATE: "true"

  worker:
    <<: *php
    # Attend que le service app ait installé les dépendances.
    entrypoint: ["sh", "-c", "until [ -f vendor/.composer-lock.sha ]; do sleep 2; done; exec \"$$@\"", "--"]
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    restart: unless-stopped

  # Tâches planifiées (routes/console.php) : expiration des créneaux non
  # payés, rappels de rendez-vous.
  scheduler:
    <<: *php
    entrypoint: ["sh", "-c", "until [ -f vendor/.composer-lock.sha ]; do sleep 2; done; exec \"$$@\"", "--"]
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${DOC_AND_I_HTTP_PORT:-8090}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doc_and_i
      POSTGRES_USER: doc_and_i
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Publiée sur le poste pour pgAdmin / DBeaver, hors du 5432 et du 5433
      # (dpi-rdc).
      # Sur 127.0.0.1 seulement : la base n'est pas joignable depuis le réseau.
      - "127.0.0.1:${DOC_AND_I_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_and_i -d doc_and_i"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  # Tests, lancés à la demande, jamais par `docker compose up`.
  # La base est forcée sur doc_and_i_test par phpunit.xml.
  tests:
    <<: *php
    profiles: ["tests"]
    environment:
      # Le conteneur db : sans ces deux lignes, la valeur par défaut de
      # phpunit.xml (127.0.0.1:5434, prévue pour le poste) l'emporterait.
      DB_HOST: db
      DB_PORT: "5432"
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    command: ["php", "artisan", "test"]

volumes:
  pgdata:
  redisdata:
  vendor:
