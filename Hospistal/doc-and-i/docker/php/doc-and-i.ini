; Pièces jointes des demandes (RDV-01) : 5 fichiers de 5 Mo au plus, plus le
; formulaire. Les valeurs par défaut de PHP (2 Mo par fichier, 8 Mo par
; requête) refusaient une photo prise au téléphone.
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 10
; Aucun secret, aucune trace interne dans une page d'erreur.
expose_php = Off
