server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    # 5 pièces jointes de 5 Mo et le formulaire (docker/php/doc-and-i.ini).
    client_max_body_size 32m;

    # DNS interne de Docker, relu toutes les 10 s : quand le conteneur app est
    # recréé (docker compose up --build), il change d'adresse. Sans cela,
    # nginx garde l'adresse lue à son démarrage et répond 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Variable : l'adresse est résolue à chaque requête, pas une fois pour toutes.
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
